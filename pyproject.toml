[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-workbench-agent"
version = "0.2.0"
description = "Local evidence-based report workbench with optional language-model analysis"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["report_workbench*"]

[tool.setuptools.package-data]
report_workbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
